# 개발 뉴스 수집 → 커밋 → 정적 빌드 → GitHub Pages 배포
#
# 데이터베이스가 없으므로 `data/news/YYYY-MM-DD.json` 커밋 자체가 저장소다.
# 중복 제거 이력도 그 JSON을 다시 읽어서 만든다 (별도 캐시/DB 없음).
#
# 한 워크플로에서 배포까지 끝내는 이유: GITHUB_TOKEN 으로 만든 푸시는
# 다른 워크플로(nextjs.yml)의 push 트리거를 발동시키지 않는다.
name: 개발 뉴스 수집·배포

on:
    schedule:
        # UTC 22:00 = KST 07:00
        - cron: "0 22 * * *"
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

# nextjs.yml 과 같은 그룹 — Pages 배포가 겹치지 않게 직렬화한다.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    collect-and-build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Setup Pages
              uses: actions/configure-pages@v5
              with:
                  static_site_generator: next

            - name: Restore Next.js cache
              uses: actions/cache@v4
              with:
                  path: .next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

            - name: Install dependencies
              run: npm ci

            - name: Collect news
              run: npm run news:collect

            - name: Commit news archive
              run: |
                  if [ -z "$(git status --porcelain data/news)" ]; then
                    echo "수집 결과에 변경이 없어 커밋을 건너뜁니다."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/news
                  git commit -m "chore(news): $(TZ=Asia/Seoul date +%Y-%m-%d) 개발 뉴스 수집"
                  git push

            - name: Build with Next.js
              run: npm run build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./out

    deploy:
        needs: collect-and-build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
